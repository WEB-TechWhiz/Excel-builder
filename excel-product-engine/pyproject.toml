[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-product-engine"
version = "0.1.0"
description = "Reusable engine for generating production-grade Excel products (Financial OS, Business Dashboard, CRM, and more) from a single architecture."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "MuffinCodes" }
]
dependencies = [
    "openpyxl>=3.1.5,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "types-PyYAML",
]
llm = [
    "anthropic>=0.40.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --cov=excel_engine --cov-report=term-missing"

[tool.coverage.run]
source = ["src/excel_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["excel_engine"]
strict = true
ignore_missing_imports = true
